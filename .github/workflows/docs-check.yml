name: Docs Check

on:
  pull_request:
    branches: [ '*' ]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'scripts/check_docs.py'
      - 'scripts/smoke_docs.py'
      - 'archipy/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.readthedocs.yaml'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  build:
    name: docs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    services:
      redis:
        image: redis:8.10.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked --group docs --extra redis

      - name: Build the docs in strict mode
        env:
          UV_NO_SYNC: "true"
          READTHEDOCS_CANONICAL_URL: ${{ matrix.python-version == '3.15' && 'https://archipy.readthedocs.io/en/latest/' || '' }}
        run: make docs-check

      - name: Run documentation examples
        env:
          UV_NO_SYNC: "true"
          REDIS__MASTER_HOST: redis
        run: make docs-smoke

  docs-check:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success
