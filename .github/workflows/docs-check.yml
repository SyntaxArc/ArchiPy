name: Docs Check

on:
  pull_request:
    branches: [ '*' ]
    paths:
      - 'docs/**'
      - 'archipy/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.readthedocs.yaml'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  build:
    name: docs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    env:
      UV_PYTHON: ${{ matrix.python-version }}+gil
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build the docs in strict mode
        env:
          UV_NO_SYNC: "true"
        run: make docs-check

  docs-check:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = success
