name: Ruff Lint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (${{ matrix.target-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    strategy:
      fail-fast: false
      matrix:
        target-version: ["py314", "py315"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install lint tools
        run: uv sync --locked --only-group dev

      - name: Run Ruff check
        run: uv run --no-sync ruff check --no-fix --output-format=github --target-version ${{ matrix.target-version }} archipy packages features/steps scripts

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check --target-version ${{ matrix.target-version }} archipy packages features/steps scripts

  gherkin:
    name: gherkin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/cache-uv
        with:
          suffix: gherkin-${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run Gherkin format check
        run: uv run --no-sync gherkin-formatter --check features/

  lint:
    needs: [ruff, gherkin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ruff.result }}" = success && test "${{ needs.gherkin.result }}" = success
