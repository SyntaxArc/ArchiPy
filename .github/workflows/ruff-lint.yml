name: Ruff Lint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
          src: "archipy features/steps scripts"

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: "archipy features/steps scripts"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Cache UV
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.14-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Gherkin format check
        run: uv run gherkin-formatter --check features/
