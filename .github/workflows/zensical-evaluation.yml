name: Zensical evaluation

on:
  pull_request:
    paths:
      - '.github/workflows/zensical-evaluation.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    steps:
      - uses: actions/checkout@v6
      - name: Install docs dependencies
        run: uv sync --python 3.15 --locked --group docs
      - name: Evaluate Zensical against existing configs
        shell: bash
        run: |
          uv run --python 3.15 --no-sync --with zensical==0.1.3 zensical --version
          for config in docs/mkdocs.yml docs/mkdocs-full.yml; do
            if uv run --python 3.15 --no-sync --with zensical==0.1.3 zensical build -f "$config" > "$RUNNER_TEMP/zensical.log" 2>&1; then
              printf '%s built successfully\n' "$config"
              find site -name index.html | wc -l
              grep -n -m 1 'FastAPIConfig|MAX_REQUESTS' site/api_reference/configs/index.html | cut -c1-180
            else
              printf '%s failed to build\n' "$config"
            fi
            tail -30 "$RUNNER_TEMP/zensical.log"
          done
