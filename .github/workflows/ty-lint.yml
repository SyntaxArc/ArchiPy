name: Ty Lint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  check:
    name: ty (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/cache-uv
        with:
          suffix: adapters-${{ matrix.python-version }}

      - name: Run Ty type checking
        uses: ./.github/actions/run-uv
        with:
          command: |
            make ci-install
            uv run --no-sync ty check --python-version "${{ matrix.python-version }}" archipy packages

  lint:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
