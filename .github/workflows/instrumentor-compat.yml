name: Instrumentor compatibility

# opentelemetry-instrumentation-sqlalchemy caps SQLAlchemy below 2.1 while ArchiPy requires 2.1, so ArchiPy
# instruments SQLAlchemy through OTEL.INSTRUMENTATION_SKIP_DEP_CHECK. This job fails as soon as an instrumentor
# release supports the required version, which is the signal to remove the bypass.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  instrumentor-compat:
    name: instrumentor compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    env:
      UV_PYTHON: ${{ matrix.python-version }}+gil
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cache-uv
        with:
          suffix: instrumentor-${{ matrix.python-version }}
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Check instrumentor version ranges
        run: ./scripts/check_instrumentor_compat.sh
