name: Behave Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  behave:
    name: behave (${{ matrix.group.name }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A standard runner has 4 CPUs and 16 GB: one behave process per feature, 4 at a time, 2 of them with a heavy
      # container (Kafka, Keycloak, Elasticsearch, StarRocks, ...). Raise both on a larger runner.
      BEHAVE_JOBS: 4
      BEHAVE_HEAVY_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        # Groups are balanced by the durations in .behave_durations.json. The last group runs every feature that is
        # in no other group, so a new feature file is picked up without touching this list.
        group:
        - name: Keycloak
          features: >-
            features/keycloak_adapter.feature
            features/keycloak_dtos.feature
            features/keycloak_protocol_mapper_configs.feature
        - name: Telemetry and Elasticsearch
          features: >-
            features/otel.feature
            features/otel_configuration.feature
            features/elastic_apm_telemetry.feature
            features/elastic_adapter.feature
        - name: Databases, cache and messaging
          features: >-
            features/atomic_transactions.feature
            features/redis_adapter.feature
            features/scylladb_adapter.feature
            features/sqlalchemy_multiple_databases.feature
            features/kafka_adapters.feature
            features/temporal_adapter.feature
            features/minio_adapter.feature
            features/fastapi_minio_upload.feature
        - name: Core, utils and payment adapters
          exclude: >-
            features/keycloak_adapter.feature
            features/keycloak_dtos.feature
            features/keycloak_protocol_mapper_configs.feature
            features/otel.feature
            features/otel_configuration.feature
            features/elastic_apm_telemetry.feature
            features/elastic_adapter.feature
            features/atomic_transactions.feature
            features/redis_adapter.feature
            features/scylladb_adapter.feature
            features/sqlalchemy_multiple_databases.feature
            features/kafka_adapters.feature
            features/temporal_adapter.feature
            features/minio_adapter.feature
            features/fastapi_minio_upload.feature

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The wheels are downloaded once and shared by every group: restoring the uv cache leaves `uv sync` only the
    # linking of the packages. Only the first job to finish saves it; the others find the key taken.
    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: make install-dev

    - name: Run Behave features in parallel
      run: make behave FEATURE="${{ matrix.group.features }}" EXCLUDE="${{ matrix.group.exclude }}"

    - name: Upload feature logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: behave-logs-${{ matrix.group.name }}
        path: .behave-logs/
        include-hidden-files: true
        retention-days: 7

  # One stable check for the whole matrix.
  behave-tests:
    name: behave-tests
    if: always()
    needs: behave
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Fail when a group failed
      run: |
        if [ "${{ needs.behave.result }}" != "success" ]; then
          echo "Behave groups: ${{ needs.behave.result }}"
          exit 1
        fi
