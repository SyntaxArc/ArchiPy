name: Behave Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Picks the feature groups a change can affect (scripts/behave_matrix.py). Pushes to master run every group.
  changes:
    name: select behave groups
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_groups: ${{ steps.select.outputs.has_groups }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Select groups
      id: select
      env:
        BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      run: python3 scripts/behave_matrix.py ${BASE_SHA:+--base "$BASE_SHA"}

  behave:
    name: behave (${{ matrix.group.name }})
    needs: changes
    if: needs.changes.outputs.has_groups == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A standard runner has 4 CPUs and 16 GB: one behave process per feature, 4 at a time, 2 of them with a heavy
      # container (Kafka, Keycloak, Elasticsearch, StarRocks, ...). Raise both on a larger runner.
      BEHAVE_JOBS: 4
      BEHAVE_HEAVY_JOBS: 2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The wheels are downloaded once and shared by every group: restoring the uv cache leaves `uv sync` only the
    # linking of the packages. Only the first job to finish saves it; the others find the key taken.
    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: make install-dev

    - name: Run Behave features in parallel
      run: make behave FEATURE="${{ matrix.group.features }}" EXCLUDE="${{ matrix.group.exclude }}"

    - name: Upload feature logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: behave-logs-${{ matrix.group.name }}
        path: .behave-logs/
        include-hidden-files: true
        retention-days: 7

  # One stable check for the whole matrix. A skipped matrix (nothing to test) passes.
  behave-tests:
    name: behave-tests
    if: always()
    needs: [changes, behave]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Fail when a group failed
      run: |
        if [ "${{ needs.changes.result }}" != "success" ]; then
          echo "Group selection: ${{ needs.changes.result }}"
          exit 1
        fi
        case "${{ needs.behave.result }}" in
          success|skipped) ;;
          *) echo "Behave groups: ${{ needs.behave.result }}"; exit 1 ;;
        esac
