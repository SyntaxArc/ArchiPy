name: Behave Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '*' ]

# A new push to a pull request or to master replaces the run of the same ref that is still going: every run starts
# about 30 jobs and the runner limit queues the rest, so stale runs only delay the current one.
concurrency:
  group: behave-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Finds which feature groups a pull request can affect. A push to master runs every group.
  changes:
    name: select behave groups
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.changes }}
      shared: ${{ steps.shared.outputs.shared }}
    steps:
    - uses: actions/checkout@v6

    # Files owned by one group: the package it tests and its feature files.
    - name: Changed groups
      id: groups
      uses: dorny/paths-filter@v3
      with:
        filters: |
          keycloak_adapter:
            - 'packages/keycloak/**'
            - 'features/keycloak_adapter.feature'
          keycloak_tokens_groups:
            - 'packages/keycloak/**'
            - 'features/keycloak_adapter_tokens_orgs.feature'
            - 'features/keycloak_adapter_management.feature'
          keycloak_clients_tokens:
            - 'packages/keycloak/**'
            - 'features/keycloak_adapter_clients_tokens.feature'
          keycloak_mappers_envoy:
            - 'packages/keycloak/**'
            - 'features/keycloak_adapter_authn_mappers.feature'
            - 'features/keycloak_auth_guards_cache_envoy.feature'
          keycloak_auth_guards:
            - 'packages/keycloak/**'
            - 'features/keycloak_auth_guards.feature'
          keycloak_auth_guards_grpc:
            - 'packages/keycloak/**'
            - 'features/keycloak_auth_guards_grpc.feature'
          kafka_a:
            - 'packages/kafka/**'
            - 'features/kafka_adapters.feature'
          kafka_b:
            - 'packages/kafka/**'
            - 'features/kafka_clients_spans.feature'
          redis:
            - 'packages/redis/**'
            - 'features/redis_adapter.feature'
            - 'features/grpc_rate_limit.feature'
          elasticsearch:
            - 'packages/elasticsearch/**'
            - 'features/elastic_adapter.feature'
            - 'features/elastic_apm_telemetry.feature'
          temporal_scylla:
            - 'packages/temporal/**'
            - 'features/temporal_schedules_errors.feature'
            - 'packages/scylladb/**'
            - 'features/scylladb_adapter.feature'
            - 'features/temporal_adapter.feature'
          light_sql:
            - 'packages/minio/**'
            - 'features/minio_adapter.feature'
            - 'features/fastapi_minio_upload.feature'
            - 'packages/vault/**'
            - 'features/vault_adapter.feature'
            - 'archipy/adapters/email/**'
            - 'features/email_adapter.feature'
            - 'packages/postgres/**'
            - 'archipy/adapters/base/sqlalchemy/**'
            - 'features/atomic_transactions_postgres.feature'
            - 'packages/mysql/**'
            - 'features/atomic_transactions_mysql.feature'
            - 'packages/sqlite/**'
            - 'features/atomic_transactions_sqlite.feature'
          sql_starrocks:
            - 'packages/starrocks/**'
            - 'archipy/adapters/base/sqlalchemy/**'
            - 'features/atomic_transactions_starrocks.feature'
          telemetry:
            - 'archipy/helpers/utils/_otel/**'
            - 'features/otel.feature'
            - 'features/otel_configuration.feature'
          apm_services:
            - 'packages/vault/**'
            - 'packages/minio/**'
            - 'archipy/adapters/email/**'
            - 'archipy/helpers/utils/_otel/**'
            - 'features/vault_adapter_apm.feature'
            - 'features/minio_adapter_apm.feature'
            - 'features/email_adapter_apm.feature'
            - 'packages/scylladb/**'
            - 'packages/elasticsearch/**'
            - 'features/scylladb_adapter_apm.feature'
            - 'features/elastic_adapter_apm.feature'
          apm_sql:
            - 'packages/postgres/**'
            - 'packages/mysql/**'
            - 'packages/sqlite/**'
            - 'archipy/adapters/base/sqlalchemy/**'
            - 'archipy/helpers/utils/_otel/**'
            - 'features/atomic_transactions_apm_postgres.feature'
            - 'features/atomic_transactions_apm_sqlite.feature'
            - 'features/atomic_transactions_apm_mysql.feature'
          apm_sql_starrocks:
            - 'packages/starrocks/**'
            - 'archipy/adapters/base/sqlalchemy/**'
            - 'archipy/helpers/utils/_otel/**'
            - 'features/atomic_transactions_apm_starrocks.feature'
          apm_messaging:
            - 'packages/kafka/**'
            - 'packages/redis/**'
            - 'archipy/helpers/utils/_otel/**'
            - 'features/kafka_adapters_apm.feature'
            - 'features/redis_adapter_apm.feature'
          apm_workflows:
            - 'packages/temporal/**'
            - 'packages/keycloak/**'
            - 'archipy/helpers/utils/_otel/**'
            - 'features/temporal_adapter_apm.feature'
            - 'features/keycloak_adapter_apm.feature'
          core:
            - 'features/app_utils.feature'
            - 'features/base_config.feature'
            - 'features/base_utils.feature'
            - 'features/cache_decorator.feature'
            - 'features/datetime_utils.feature'
            - 'features/decorators.feature'
            - 'features/error_handling.feature'
            - 'features/file_utils.feature'
            - 'features/grpc_helpers.feature'
            - 'features/jwt_utils.feature'
            - 'features/optional_dependencies.feature'
            - 'features/password_utils.feature'
            - 'features/range_dtos.feature'
            - 'features/singleton_metaclass.feature'
            - 'features/string_utils.feature'
            - 'features/totp_utils.feature'
            - 'packages/parsian-ipg/**'
            - 'packages/saman-ipg/**'
            - 'features/parsian_ipg_adapter.feature'
            - 'features/saman_ipg_adapter.feature'
            - 'archipy/adapters/base/sqlalchemy/**'
            - 'features/sqlalchemy_multiple_databases.feature'
            - 'features/database_error_classification.feature'
            - 'packages/keycloak/**'
            - 'features/keycloak_dtos.feature'
            - 'features/keycloak_protocol_mapper_configs.feature'

    # Any other changed file (shared code under archipy/, the steps, the dependencies, ...) can affect every group.
    # Documentation and the other workflows cannot affect a test.
    - name: Changed shared files
      id: shared
      uses: dorny/paths-filter@v3
      with:
        predicate-quantifier: every
        filters: |
          shared:
            - '**'
            - '!docs/**'
            - '!**/*.md'
            - '!**/*.mdc'
            - '!.cursor/**'
            - '!.agents/**'
            - '!.claude/**'
            - '!.idea/**'
            - '!LICENSE'
            - '!mkdocs.yml'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/workflows/{close-stale-issues,deploy-docs,dependency-review,docs-check,instrumentor-compat,labeler,link-check,pr-merged-issue-comment,publish,ruff-lint,ty-lint}.yml'
            - '!.github/labeler.yml'
            - '!packages/keycloak/**'
            - '!packages/kafka/**'
            - '!packages/redis/**'
            - '!packages/elasticsearch/**'
            - '!packages/scylladb/**'
            - '!packages/temporal/**'
            - '!packages/minio/**'
            - '!packages/vault/**'
            - '!packages/postgres/**'
            - '!packages/mysql/**'
            - '!packages/sqlite/**'
            - '!packages/starrocks/**'
            - '!archipy/adapters/base/sqlalchemy/**'
            - '!archipy/adapters/email/**'
            - '!packages/parsian-ipg/**'
            - '!packages/saman-ipg/**'
            - '!archipy/helpers/utils/_otel/**'
            - '!features/vault_adapter_apm.feature'
            - '!features/minio_adapter_apm.feature'
            - '!features/scylladb_adapter_apm.feature'
            - '!features/email_adapter_apm.feature'
            - '!features/elastic_adapter_apm.feature'
            - '!features/atomic_transactions_apm_postgres.feature'
            - '!features/atomic_transactions_apm_mysql.feature'
            - '!features/atomic_transactions_apm_starrocks.feature'
            - '!features/atomic_transactions_apm_sqlite.feature'
            - '!features/kafka_adapters_apm.feature'
            - '!features/redis_adapter_apm.feature'
            - '!features/keycloak_adapter_apm.feature'
            - '!features/temporal_adapter_apm.feature'
            - '!features/atomic_transactions_postgres.feature'
            - '!features/atomic_transactions_mysql.feature'
            - '!features/atomic_transactions_sqlite.feature'
            - '!features/atomic_transactions_starrocks.feature'
            - '!features/database_error_classification.feature'
            - '!features/elastic_adapter.feature'
            - '!features/elastic_apm_telemetry.feature'
            - '!features/email_adapter.feature'
            - '!features/fastapi_minio_upload.feature'
            - '!features/grpc_rate_limit.feature'
            - '!features/kafka_adapters.feature'
            - '!features/kafka_clients_spans.feature'
            - '!features/keycloak_adapter.feature'
            - '!features/keycloak_adapter_tokens_orgs.feature'
            - '!features/keycloak_adapter_management.feature'
            - '!features/keycloak_adapter_clients_tokens.feature'
            - '!features/keycloak_adapter_authn_mappers.feature'
            - '!features/keycloak_auth_guards.feature'
            - '!features/keycloak_auth_guards_grpc.feature'
            - '!features/keycloak_auth_guards_cache_envoy.feature'
            - '!features/keycloak_dtos.feature'
            - '!features/keycloak_protocol_mapper_configs.feature'
            - '!features/minio_adapter.feature'
            - '!features/otel.feature'
            - '!features/otel_configuration.feature'
            - '!features/parsian_ipg_adapter.feature'
            - '!features/redis_adapter.feature'
            - '!features/saman_ipg_adapter.feature'
            - '!features/scylladb_adapter.feature'
            - '!features/sqlalchemy_multiple_databases.feature'
            - '!features/temporal_adapter.feature'
            - '!features/temporal_schedules_errors.feature'
            - '!features/vault_adapter.feature'
            - '!features/app_utils.feature'
            - '!features/base_config.feature'
            - '!features/base_utils.feature'
            - '!features/cache_decorator.feature'
            - '!features/datetime_utils.feature'
            - '!features/decorators.feature'
            - '!features/error_handling.feature'
            - '!features/file_utils.feature'
            - '!features/grpc_helpers.feature'
            - '!features/jwt_utils.feature'
            - '!features/optional_dependencies.feature'
            - '!features/password_utils.feature'
            - '!features/range_dtos.feature'
            - '!features/singleton_metaclass.feature'
            - '!features/string_utils.feature'
            - '!features/totp_utils.feature'

  behave:
    name: behave (${{ matrix.group.name }})
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A standard runner has 4 CPUs and 16 GB: one behave process per feature, 4 at a time, 2 of them with a heavy
      # container (Kafka, Keycloak, Elasticsearch, StarRocks, ...). Raise both on a larger runner.
      BEHAVE_JOBS: 4
      BEHAVE_HEAVY_JOBS: 2
      # Every step is skipped, and the job passes at once, for a group the change cannot affect.
      RUN: ${{ github.event_name == 'push' || needs.changes.outputs.shared == 'true' || contains(fromJSON(needs.changes.outputs.groups), matrix.group.id) }}
    strategy:
      fail-fast: false
      matrix:
        # Jobs start in this order and only about 16 run at once, so the slowest groups come first and the quick ones wait.
        # The core group runs every feature that no other group lists, so a new feature file is picked up without
        # touching this list.
        group:
        - id: core
          name: Core, unit tests and utilities
          exclude: >-
            features/atomic_transactions_sqlite.feature
            features/atomic_transactions_postgres.feature
            features/atomic_transactions_mysql.feature
            features/atomic_transactions_starrocks.feature
            features/elastic_adapter.feature
            features/elastic_apm_telemetry.feature
            features/email_adapter.feature
            features/fastapi_minio_upload.feature
            features/grpc_rate_limit.feature
            features/kafka_adapters.feature
            features/kafka_clients_spans.feature
            features/keycloak_adapter.feature
            features/keycloak_adapter_tokens_orgs.feature
            features/keycloak_adapter_management.feature
            features/keycloak_adapter_clients_tokens.feature
            features/keycloak_adapter_authn_mappers.feature
            features/keycloak_auth_guards.feature
            features/keycloak_auth_guards_grpc.feature
            features/keycloak_auth_guards_cache_envoy.feature
            features/minio_adapter.feature
            features/otel.feature
            features/otel_configuration.feature
            features/redis_adapter.feature
            features/scylladb_adapter.feature
            features/temporal_adapter.feature
            features/temporal_schedules_errors.feature
            features/vault_adapter.feature
            features/vault_adapter_apm.feature
            features/minio_adapter_apm.feature
            features/scylladb_adapter_apm.feature
            features/email_adapter_apm.feature
            features/elastic_adapter_apm.feature
            features/atomic_transactions_apm_postgres.feature
            features/atomic_transactions_apm_mysql.feature
            features/atomic_transactions_apm_starrocks.feature
            features/atomic_transactions_apm_sqlite.feature
            features/kafka_adapters_apm.feature
            features/redis_adapter_apm.feature
            features/keycloak_adapter_apm.feature
            features/temporal_adapter_apm.feature
        - id: keycloak_tokens_groups
          name: Keycloak (tokens, organizations, groups and scopes)
          features: >-
            features/keycloak_adapter_tokens_orgs.feature
            features/keycloak_adapter_management.feature
        - id: elasticsearch
          name: Elasticsearch
          features: >-
            features/elastic_adapter.feature
            features/elastic_apm_telemetry.feature
        - id: apm_messaging
          name: Elastic APM (Kafka and Redis)
          features: >-
            features/kafka_adapters_apm.feature
            features/redis_adapter_apm.feature
        - id: keycloak_auth_guards_grpc
          name: Keycloak (gRPC guards)
          features: >-
            features/keycloak_auth_guards_grpc.feature
        - id: apm_sql
          name: Elastic APM (PostgreSQL, MySQL and SQLite)
          features: >-
            features/atomic_transactions_apm_postgres.feature
            features/atomic_transactions_apm_sqlite.feature
            features/atomic_transactions_apm_mysql.feature
        - id: apm_sql_starrocks
          name: Elastic APM (StarRocks)
          features: >-
            features/atomic_transactions_apm_starrocks.feature
        - id: apm_services
          name: Elastic APM (Vault, MinIO, email, ScyllaDB and Elasticsearch)
          features: >-
            features/vault_adapter_apm.feature
            features/minio_adapter_apm.feature
            features/email_adapter_apm.feature
            features/scylladb_adapter_apm.feature
            features/elastic_adapter_apm.feature
        - id: kafka_a
          name: Kafka (admin, producers and consumers)
          features: >-
            features/kafka_adapters.feature
        - id: apm_workflows
          name: Elastic APM (Temporal and Keycloak)
          features: >-
            features/temporal_adapter_apm.feature
            features/keycloak_adapter_apm.feature
        - id: kafka_b
          name: Kafka (clients and spans)
          features: >-
            features/kafka_clients_spans.feature
        - id: sql_starrocks
          name: SQL (StarRocks)
          features: >-
            features/atomic_transactions_starrocks.feature
        - id: keycloak_mappers_envoy
          name: Keycloak (authentication flows, mappers and Envoy guards)
          features: >-
            features/keycloak_adapter_authn_mappers.feature
            features/keycloak_auth_guards_cache_envoy.feature
        - id: redis
          name: Redis
          features: >-
            features/redis_adapter.feature
            features/grpc_rate_limit.feature
        - id: temporal_scylla
          name: Temporal and ScyllaDB
          features: >-
            features/temporal_schedules_errors.feature
            features/scylladb_adapter.feature
            features/temporal_adapter.feature
        - id: keycloak_clients_tokens
          name: Keycloak (clients and keys)
          features: >-
            features/keycloak_adapter_clients_tokens.feature
        - id: keycloak_adapter
          name: Keycloak (realms, users and roles)
          features: >-
            features/keycloak_adapter.feature
        - id: telemetry
          name: Telemetry
          features: >-
            features/otel.feature
            features/otel_configuration.feature
        - id: keycloak_auth_guards
          name: Keycloak (FastAPI auth guards)
          features: >-
            features/keycloak_auth_guards.feature
        - id: light_sql
          name: MinIO, Vault, email and SQL (PostgreSQL, MySQL, SQLite)
          features: >-
            features/minio_adapter.feature
            features/fastapi_minio_upload.feature
            features/vault_adapter.feature
            features/email_adapter.feature
            features/atomic_transactions_postgres.feature
            features/atomic_transactions_mysql.feature
            features/atomic_transactions_sqlite.feature

    steps:
    - uses: actions/checkout@v6
      if: env.RUN == 'true'

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      if: env.RUN == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The wheels are downloaded once and shared by every group: restoring the uv cache leaves `uv sync` only the
    # linking of the packages. Only the first job to finish saves it; the others find the key taken.
    - name: Install UV
      if: env.RUN == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ env.PYTHON_VERSION }}

    # The locked versions of the extras (they pull in the workspace packages), without the dev tools, the pre-commit
    # hooks and the dependency upgrade that `make install-dev` adds.
    - name: Install dependencies
      if: env.RUN == 'true'
      run: uv sync --locked --all-extras

    - name: Run Behave features in parallel
      if: env.RUN == 'true'
      run: make behave FEATURE="${{ matrix.group.features }}" EXCLUDE="${{ matrix.group.exclude }}"

    - name: Upload feature logs
      if: failure() && env.RUN == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: behave-logs-${{ matrix.group.name }}
        path: .behave-logs/
        include-hidden-files: true
        retention-days: 7

  # One stable check for the whole matrix.
  behave-tests:
    name: behave-tests
    if: always()
    needs: [changes, behave]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Fail when a group failed
      run: |
        if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ needs.behave.result }}" != "success" ]; then
          echo "Group selection: ${{ needs.changes.result }}, behave groups: ${{ needs.behave.result }}"
          exit 1
        fi
