name: Build and Publish
permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: build packages (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Update version in pyproject.toml
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/}
        # Update version and archipy-* pins in core and every workspace package
        for f in pyproject.toml packages/*/pyproject.toml; do
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/; s/\"archipy(-[a-z-]+)?(\[[a-z]+\])?==[^\"]*\"/\"archipy\1\2==$VERSION\"/" "$f"
        done

    - name: Build distributions
      run: uv build --all-packages --python "$UV_PYTHON"

    - name: Upload distributions for publishing
      if: matrix.python-version == '3.14'
      uses: actions/upload-artifact@v4
      with:
        name: distributions
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.13.9-trixie
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v5
      with:
        name: distributions
        path: dist

    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: uv publish
