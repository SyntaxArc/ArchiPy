[project]
name = "archipy-keycloak"
description = "ArchiPy keycloak adapter."
authors = [
    { name = "Hossein Nejati", email = "hosseinnejati14@gmail.com" },
]
readme = "README.md"
version = "0.1.0" # This version is set on publish flow!
requires-python = ">=3.14,<4"
dependencies = [
    "archipy==0.1.0", # Pinned to core version on publish flow!
    "python-keycloak>=7.1.1",
    "cachetools>=7.2.3",
    "async-lru>=2.4.0",
]
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archipy"]

[tool.uv.sources]
archipy = { workspace = true }
