[project]
name = "archipy-parsian-ipg"
description = "ArchiPy parsian-ipg adapter."
authors = [
    { name = "Hossein Nejati", email = "hosseinnejati14@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0"
version = "0.1.0" # This version is set on publish flow!
requires-python = ">=3.14,<4"
dependencies = [
    "archipy==0.1.0", # Pinned to core version on publish flow!
]

[project.optional-dependencies]
sync = ["zeep>=4.3.3", "requests[socks]>=2.34.2"]
async = ["zeep[async]>=4.3.3", "httpx2[socks]>=2.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archipy"]

[tool.uv.sources]
archipy = { workspace = true }
