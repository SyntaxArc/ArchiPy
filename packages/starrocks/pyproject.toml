[project]
name = "archipy-starrocks"
description = "ArchiPy starrocks adapter."
authors = [
    { name = "Hossein Nejati", email = "hosseinnejati14@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0"
version = "0.1.0" # This version is set on publish flow!
requires-python = ">=3.14,<4"
dependencies = [
    "archipy==0.1.0", # Pinned to core version on publish flow!
]

[project.optional-dependencies]
sync = ["starrocks>=1.3.4", "pymysql>=1.2.3"]
async = ["sqlalchemy[asyncio]>=2.1.6", "starrocks>=1.3.4", "asyncmy>=0.2.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archipy"]

[tool.uv.sources]
archipy = { workspace = true }
