[project.theme]
variant = "classic"
language = "en"
custom_dir = "overrides"
logo = "assets/logo.jpg"
favicon = "assets/logo.jpg"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.expand",
    "navigation.indexes",
    "toc.follow",
    "content.code.copy",
    "content.tabs.link",
    "content.action.edit",
    "navigation.top",
    "search.highlight",
    "content.code.annotate",
    "content.tooltips",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "indigo"
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "indigo"
toggle = { icon = "material/weather-sunny", name = "Switch to light mode" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SyntaxArc/ArchiPy"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.search]

[project.plugins.autorefs]

[project.plugins.mkdocstrings.handlers.python]
paths = [
    ".",
    "packages/elasticsearch",
    "packages/kafka",
    "packages/keycloak",
    "packages/minio",
    "packages/mysql",
    "packages/parsian-ipg",
    "packages/postgres",
    "packages/redis",
    "packages/saman-ipg",
    "packages/scylladb",
    "packages/sqlite",
    "packages/starrocks",
    "packages/temporal",
    "packages/vault",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
filters = ["!^_"]
heading_level = 2
inherited_members = true
members_order = "source"
separate_signature = true
show_bases = true
show_if_no_docstring = true
show_object_full_path = true
show_root_toc_entry = true
show_signature_annotations = true
show_source = true
show_submodules = true
summary = false
