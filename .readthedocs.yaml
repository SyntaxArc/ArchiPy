# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"  # Read the Docs bootstrap. uv supplies Python 3.15 for Zensical.
  commands:
    - >-
      curl -fsSL https://astral.sh/uv/0.13.9/install.sh -o /tmp/archipy-uv-install.sh &&
      UV_UNMANAGED_INSTALL="$HOME/.local/bin" sh /tmp/archipy-uv-install.sh
    - '"$HOME/.local/bin/uv" sync --python 3.15 --locked --group docs'
    - '"$HOME/.local/bin/uv" run --python 3.15 --no-sync zensical build --clean --strict'
    - mkdir -p "$READTHEDOCS_OUTPUT/html" && cp -a site/. "$READTHEDOCS_OUTPUT/html/"

search:
  ranking:
    index.md: 5
    installation.md: 5
    usage.md: 4
    features.md: 3
    api_reference/index.md: 4
    api_reference/**/*: 3
    examples/index.md: 4
    examples/**/*: 3
    architecture.md: 2
    changelog.md: 2
    development.md: 2
    contributing.md: 1
    contributing-docs.md: 1
    license.md: -3
