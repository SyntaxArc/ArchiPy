# Fast build configuration for local development
# Use this for quick iterations: mkdocs serve -f docs/mkdocs-fast.yml
# Plugin settings are merged over docs/mkdocs.yml: only the differences are listed here.

INHERIT: ./mkdocs.yml

plugins:
  mkdocstrings:
    enabled: true
    handlers:
      python:
        options:
          # Maximum performance for local dev
          show_source: false
          show_root_toc_entry: false
          heading_level: 3
          members_order: alphabetical
          show_signature_annotations: false
          separate_signature: false
          filters:
            - "!^_"
            - "!^__"
          members: false  # Don't auto-document members
          docstring_section_style: list  # Faster than table
