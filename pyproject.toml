[project]
name = "archipy"
description = "Architecture + Python – Perfect for structured design."
authors = [
    { name = "Hossein Nejati", email = "hosseinnejati14@gmail.com" },
]
readme = "README.md"
version = "0.1.0" # This version set on publish flow!
requires-python = ">=3.14,<4"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pydantic-extra-types>=2.11.1",
    "httpx2>=2.16.0",
    "jdatetime>=6.1.1",
]
license = { file = "LICENSE" }

[project.optional-dependencies]
# Core optional dependencies
aiosqlite = ["archipy-sqlite==0.1.0"]  # Pinned to core version on publish flow!
behave = ["behave>=1.3.3"]
cache = ["cachetools>=7.2.4", "async-lru>=2.4.0"]
dependency-injection = ["dependency-injector>=4.49.1"]
elasticsearch = ["archipy-elasticsearch==0.1.0"]  # Pinned to core version on publish flow!
elasticsearch-async = ["archipy-elasticsearch==0.1.0", "elasticsearch[async]>=9.5.1"]  # Pinned to core version on publish flow!
fakeredis = ["fakeredis>=2.40.0"]
fastapi = ["fastapi[all]>=0.162.0"]
grpc = ["grpcio>=1.84.1", "grpcio-health-checking>=1.84.1", "protobuf>=7.36.2"]
jwt = ["pyjwt>=2.15.1"]
kafka = ["archipy-kafka==0.1.0"]  # Pinned to core version on publish flow!
keycloak = ["archipy-keycloak==0.1.0"]  # Pinned to core version on publish flow!
minio = ["archipy-minio==0.1.0"]  # Pinned to core version on publish flow!
parsian-ipg = ["archipy-parsian-ipg[sync]==0.1.0"]  # Pinned to core version on publish flow!
parsian-ipg-async = ["archipy-parsian-ipg[async]==0.1.0"]  # Pinned to core version on publish flow!
mysql = ["archipy-mysql[sync]==0.1.0"]  # Pinned to core version on publish flow!
mysql-async = ["archipy-mysql[async]==0.1.0"]  # Pinned to core version on publish flow!
postgres = ["archipy-postgres==0.1.0"]  # Pinned to core version on publish flow!
redis = ["archipy-redis==0.1.0"]  # Pinned to core version on publish flow!
saman-ipg = ["archipy-saman-ipg==0.1.0"]  # Pinned to core version on publish flow!
scheduler = ["apscheduler>=3.11.3"]
scylladb = ["archipy-scylladb==0.1.0"]  # Pinned to core version on publish flow!
sqlalchemy = ["sqlalchemy>=2.1.6"]
sqlalchemy-async = ["sqlalchemy[asyncio]>=2.1.6"]
starrocks = ["archipy-starrocks[sync]==0.1.0"]  # Pinned to core version on publish flow!
starrocks-async = ["archipy-starrocks[async]==0.1.0"]  # Pinned to core version on publish flow!
temporalio = ["archipy-temporal==0.1.0"]  # Pinned to core version on publish flow!
testcontainers = ["testcontainers[elasticsearch, minio, mysql, vault]>=4.15.0"]
vault = ["archipy-vault==0.1.0"]  # Pinned to core version on publish flow!

otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-threading>=0.66b1",
    "opentelemetry-propagator-b3>=1.45.1",
    "opentelemetry-instrumentation-system-metrics>=0.66b1",
    "opentelemetry-exporter-prometheus>=0.66b1",
]
otel-grpc = ["archipy[otel]", "opentelemetry-instrumentation-grpc>=0.66b1"]
otel-sqlalchemy = ["archipy[otel]", "opentelemetry-instrumentation-sqlalchemy>=0.66b1"]
otel-redis = ["archipy[otel]", "opentelemetry-instrumentation-redis>=0.66b1"]
otel-kafka = ["archipy[otel]", "opentelemetry-instrumentation-confluent-kafka>=0.66b1"]
otel-scylladb = ["archipy[otel]", "opentelemetry-instrumentation-cassandra>=0.66b1"]
otel-minio = ["archipy[otel]", "opentelemetry-instrumentation-botocore>=0.66b1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archipy"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
archipy-redis = { workspace = true }
archipy-elasticsearch = { workspace = true }
archipy-kafka = { workspace = true }
archipy-keycloak = { workspace = true }
archipy-minio = { workspace = true }
archipy-scylladb = { workspace = true }
archipy-temporal = { workspace = true }
archipy-vault = { workspace = true }
archipy-postgres = { workspace = true }
archipy-mysql = { workspace = true }
archipy-sqlite = { workspace = true }
archipy-starrocks = { workspace = true }
archipy-parsian-ipg = { workspace = true }
archipy-saman-ipg = { workspace = true }

[dependency-groups]
dev = [
    "add-trailing-comma>=4.0.0",
    "bandit>=1.9.4",
    "boto3-stubs>=1.43.118",
    "codespell>=2.4.3",
    "coverage>=7.17.0",
    "gherkin-formatter>=0.1.3",
    "import-linter>=2.15",
    "pre-commit-hooks>=6.0.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-cachetools>=7.0.0.20260713",
    "types-grpcio>=1.84.0.20261021",
    "types-protobuf>=7.35.1.20260906",
    "types-pymysql>=1.2.0.20260923",
    "types-regex>=2026.9.29.20261017",
    "types-requests>=2.33.0.20261006",
    "validate-pyproject>=0.27",
]

docs = [
    "mkdocs-autorefs>=1.4.5",
    "mkdocs-material>=9.7.7",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.10",
    "mkdocstrings>=1.0.8",
    "pymdown-extensions>=12.3",
]


[project.urls]
Homepage = "https://syntaxarc.github.io/ArchiPy/"
Documentation = "https://archipy.readthedocs.io/"
"Bug Tracker" = "https://github.com/SyntaxArc/ArchiPy/issues"
"Source Code" = "https://github.com/SyntaxArc/ArchiPy"
"Contributing" = "https://github.com/SyntaxArc/ArchiPy/blob/master/CONTRIBUTING.md"
"Code of Conduct" = "https://github.com/SyntaxArc/ArchiPy/blob/master/CODE_OF_CONDUCT.md"


[tool.importlinter]
root_packages = ["archipy"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "ArchiPy layers: adapters -> helpers -> configs -> models"
type = "layers"
layers = ["archipy.adapters", "archipy.helpers", "archipy.configs", "archipy.models"]
ignore_imports = [
    # Deprecated import paths of moved code (atomic decorators, Keycloak auth); remove with the shim modules in 6.0.0
    "archipy.helpers.decorators.sqlalchemy_transaction -> archipy.adapters.base.sqlalchemy.atomic",
    "archipy.helpers.utils.keycloak_utils -> archipy.adapters.keycloak.auth",
    # Function-scoped import of the default Redis store; helpers-configs.mdc allows it and a store= argument replaces it
    "archipy.helpers.interceptors.grpc.rate_limit.grpc_rate_limit_interceptor -> archipy.adapters.redis.adapters",
]

[tool.ruff]
# Enable automatic fixes for supported rules
fix = true

lint.select = [
    "A", # flake8-builtins
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "C901", # complex-structure
    "D", # pydocstyle
    "E", # pycodestyle errors
    "EM", # flake8-errmsg
    "ERA", # eradicate
    "F", # pyflakes
    "FAST", # FastAPI
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "LOG", # flake8-logging
    "PERF", # Perflint
    "PIE", # flake8-pie
    "PL", # Pylint (includes PLC, PLE, PLR, PLW)
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "RUF", # Ruff-specific rules
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TC", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

# Explicitly ignore specific rules
lint.ignore = []

# Define source directories
src = ["archipy", "packages/redis", "packages/elasticsearch", "packages/kafka", "packages/keycloak", "packages/minio", "packages/scylladb", "packages/temporal", "packages/vault", "packages/postgres", "packages/mysql", "packages/sqlite", "packages/starrocks", "packages/parsian-ipg", "packages/saman-ipg"]

exclude = [
    "features/*",
    "scripts/*",
    ".agents/*",
]

# Set line length for Ruff formatter
line-length = 120

# Target Python version
target-version = "py314"

# Ruff format configuration
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Line ending style
line-ending = "auto"
# Skip magic trailing comma
skip-magic-trailing-comma = false
# Docstring code format
docstring-code-format = true
# Docstring code line length
docstring-code-line-length = "dynamic"

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"packages/keycloak/archipy/adapters/keycloak/auth.py" = ["B008", "PLR0913", "PLR0917"]  # FastAPI Depends/Security defaults (intentional)
"archipy/helpers/utils/app_utils.py" = ["PLC0415"]  # Allow lazy imports for optional dependencies
"archipy/helpers/utils/jwt_utils.py" = ["PLC0415"]  # Allow lazy imports for optional dependencies
"archipy/helpers/utils/error_utils.py" = ["PLC0415"]  # Allow lazy imports for optional dependencies
"archipy/helpers/errors/capture.py" = ["PLC0415"]  # Lazy optional OpenTelemetry import
"packages/elasticsearch/archipy/adapters/elasticsearch/ports.py" = ["ANN401"]  # Allow Any type for **kwargs parameters
"packages/keycloak/archipy/adapters/keycloak/resources/**/port*.py" = ["ANN401", "PLR0913", "PLR0917"]  # Port mixins inherit ports.py ANN401 exemption
"packages/keycloak/archipy/adapters/keycloak/protocols/**/port*.py" = ["ANN401", "PLR0913", "PLR0917"]  # Port mixins inherit ports.py ANN401 exemption
"packages/keycloak/archipy/adapters/keycloak/type_aliases.py" = ["ANN401"]  # Any-typed aliases for ports
"packages/redis/archipy/adapters/redis/port_mixins/*" = ["ANN401", "ARG002", "PLR0913", "PLR0917"]  # Port mixins: Any types and unused interface params
"packages/scylladb/archipy/adapters/scylladb/ports.py" = ["ANN401"]  # Allow Any type for CQL parameters
"packages/temporal/archipy/adapters/temporal/base.py" = ["ARG002"]  # Override hooks may leave cache_key unused in default impl
"packages/redis/archipy/adapters/redis/adapter_mixins/*" = ["ANN401", "PLR0913", "PLR0917"]  # Adapter mixins: Any types and arity
"packages/redis/archipy/adapters/redis/search.py" = ["ANN401"]  # redis-py search result objects use dynamic shapes
"packages/redis/archipy/adapters/redis/search_ports.py" = ["ANN401"]  # Port escape hatch kwargs
"packages/redis/archipy/adapters/redis/mocks.py" = ["ARG002", "ARG004", "ANN401"]  # Override unused args; ARG005 fixed via _prefix
"packages/scylladb/archipy/adapters/scylladb/adapters.py" = ["ANN401"]  # Allow Any types
"packages/keycloak/archipy/adapters/keycloak/resources/**/adapter*.py" = ["ANN401", "PLR0913", "PLR0917"]  # Adapter mixins: Any types and arity
"packages/keycloak/archipy/adapters/keycloak/protocols/**/adapter*.py" = ["ANN401", "PLR0913", "PLR0917"]  # Adapter mixins: Any types and arity
"packages/keycloak/archipy/adapters/keycloak/base.py" = ["ANN401", "PLR0913", "PLR0917"]  # Shared adapter helpers: Any types and arity
"packages/keycloak/archipy/adapters/keycloak/connection.py" = ["ANN401", "PLR0913", "PLR0917"]  # Connection mixins: Any types and arity
"packages/temporal/archipy/adapters/temporal/*" = ["ANN401", "PLC0415", "PLR0913", "PLR0917"]  # OTel/SQLAlchemy optional cross-extra lazy imports; Any/arity
"packages/scylladb/archipy/adapters/scylladb/*" = ["S608"]  # False positives - parameterized CQL with %s placeholders (also # nosec B608)
"archipy/helpers/decorators/*" = ["PLR0913", "PLC0415", "PLR0917"]  # Many params, lazy imports in decorators
"archipy/helpers/utils/otel_utils.py" = ["PLC0415", "ANN401", "PLR0913", "PLR0917"]  # Lazy optional deps; provider/instrumentor union types
"archipy/helpers/utils/_otel/*" = ["PLC0415", "ANN401", "PLR0913", "PLR0917"]  # Same as otel_utils: lazy optional deps, dynamic OTel types
"archipy/adapters/base/sqlalchemy/session_managers.py" = ["PLC0415"]  # Lazy sqlalchemy.ext.asyncio (needs greenlet via sqlalchemy-async)
"archipy/adapters/base/sqlalchemy/atomic.py" = ["ANN401", "PLC0415", "PLR0913", "PLR0917"]  # Atomic decorators: Any in wrappers, lazy registry import
"archipy/models/errors/base_error.py" = ["PLC0415"]  # Circular import workaround
"archipy/helpers/utils/string_utils_constants.py" = ["RUF003"]  # Intentional Persian/Arabic glyph documentation in comments
"archipy/models/types/persian_digit_type.py" = ["RUF001", "RUF002"]  # Intentional Persian digit glyphs
"archipy/adapters/email/ports.py" = ["PLR0913", "PLR0917"]  # Email port mirrors SMTP send arity
"archipy/adapters/email/adapters.py" = ["PLC0415", "PLR0913", "PLR0917"]  # Email adapter mirrors SMTP send arity; lazy optional OpenTelemetry import for SMTP spans
"packages/kafka/archipy/adapters/kafka/adapters.py" = ["PLC0415"]  # Lazy optional OpenTelemetry import to end consume spans
"packages/minio/archipy/adapters/minio/ports.py" = ["PLR0913", "PLR0917"]  # MinIO/S3 port mirrors boto operation arity
"archipy/helpers/utils/datetime_utils.py" = ["PLR0913", "PLR0917"]  # Datetime helper public API arity
"archipy/helpers/utils/string_utils.py" = ["PLR0913"]  # Persian normalization flag arity
"archipy/helpers/utils/rate_limit_utils.py" = ["PLR0913", "PLR0917"]  # Rate-limit window computation arity
"archipy/helpers/interceptors/grpc/rate_limit/stores.py" = ["PLR0913", "PLR0917"]  # Store ports mirror the Redis INCREX arity
"archipy/helpers/interceptors/grpc/rate_limit/grpc_rate_limit_interceptor.py" = ["PLR0913", "PLR0917"]  # gRPC interceptor mirrors rate-limit config arity
"archipy/configs/vault_settings_source.py" = ["PLR0913", "PLR0917"]  # Vault settings source mirrors hvac client arity
"archipy/models/dtos/redis/search/search_query_dto.py" = ["PLR0913"]  # RedisSearch query factory arity

[tool.ruff.lint.mccabe]
max-complexity = 10  # Maximum allowed McCabe complexity

# Configure Pylint rules
[tool.ruff.lint.pylint]
max-args = 5  # Maximum number of function arguments
max-branches = 25  # Maximum number of branches in a function (increased for complex auth/tracing logic)
max-returns = 16  # Maximum number of return statements in a function
max-statements = 75  # Maximum number of statements in a function (increased for decorators/interceptors)

# Configure isort (import sorting)
[tool.ruff.lint.isort]
combine-as-imports = true  # Combine `import` and `from ... import` statements
known-first-party = ["archipy"]  # Treat `archipy` as a first-party module
known-third-party = ["redis", "starrocks", "keycloak", "elasticsearch", "kafka", "minio", "vault", "temporalio"]  # Workspace package dirs share names with third-party libs
section-order = [
    "future", # `__future__` imports
    "standard-library", # Standard library imports
    "third-party", # Third-party imports
    "first-party", # First-party imports (e.g., `archipy`)
    "local-folder", # Local folder imports
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"  # Use double quotes for inline strings
multiline-quotes = "double"  # Use double quotes for multiline strings

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

# Configure flake8-comprehensions
[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true  # Allow dict(a=1, b=2) style

# Configure flake8-errmsg
[tool.ruff.lint.flake8-errmsg]
max-string-length = 80  # Allow reasonable error messages

# Configure flake8-type-checking
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "archipy.models.dtos.base_dtos.BaseDTO",
    "archipy.models.dtos.keycloak.base.KeycloakBaseDTO",
    "archipy.models.dtos.keycloak.base.KeycloakRequestDTO",
    "archipy.models.dtos.keycloak.base.KeycloakResponseDTO",
]
runtime-evaluated-decorators = [
    "pydantic.validator",
    "pydantic.field_validator",
]
exempt-modules = ["typing", "typing_extensions"]

# Configure flake8-unused-arguments
[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true  # Allow unused *args, **kwargs

[tool.ty.environment]
# Target Python version
python-version = "3.14"

[tool.ty.src]
# Include source directories
include = ["archipy", "packages"]
# Exclude directories from type checking
exclude = ["features", "scripts", ".agents"]

[tool.ty.rules]
# Enable strict type checking rules (similar to mypy strict mode)
# Error-level rules (default)
abstract-method-in-final-class = "error"
assert-type-unspellable-subtype = "error"
call-abstract-method = "error"
call-non-callable = "error"
call-top-callable = "error"
conflicting-declarations = "error"
conflicting-metaclass = "error"
cyclic-class-definition = "error"
cyclic-type-alias-definition = "error"
dataclass-field-order = "error"
duplicate-base = "error"
duplicate-kw-only = "error"
empty-body = "error"
escape-character-in-forward-annotation = "error"
final-on-non-method = "error"
final-without-value = "error"
implicit-concatenated-string-type-annotation = "error"
inconsistent-mro = "error"
index-out-of-bounds = "error"
instance-layout-conflict = "error"
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-attribute-access = "error"
invalid-attribute-override = "error"
invalid-await = "error"
invalid-base = "error"
invalid-context-manager = "error"
invalid-dataclass = "error"
invalid-dataclass-override = "error"
invalid-declaration = "error"
invalid-enum-member-annotation = "error"
invalid-exception-caught = "error"
invalid-explicit-override = "error"
invalid-frozen-dataclass-subclass = "error"
invalid-generic-class = "error"
invalid-generic-enum = "error"
invalid-key = "error"
invalid-legacy-positional-parameter = "error"
invalid-legacy-type-variable = "error"
invalid-match-pattern = "error"
invalid-metaclass = "error"
invalid-method-override = "error"
invalid-named-tuple = "error"
invalid-named-tuple-override = "error"
invalid-newtype = "error"
invalid-overload = "error"
invalid-parameter-default = "error"
invalid-paramspec = "error"
invalid-protocol = "error"
invalid-raise = "error"
invalid-return-type = "error"
invalid-super-argument = "error"
invalid-syntax-in-forward-annotation = "error"
invalid-total-ordering = "error"
invalid-type-alias-type = "error"
invalid-type-arguments = "error"
invalid-type-checking-constant = "error"
invalid-type-form = "error"
invalid-type-guard-definition = "error"
invalid-type-variable-bound = "error"
invalid-type-variable-constraints = "error"
invalid-type-variable-default = "error"
invalid-typed-dict-field = "error"
invalid-typed-dict-header = "error"
invalid-typed-dict-statement = "error"
invalid-yield = "error"
isinstance-against-protocol = "error"
isinstance-against-typed-dict = "error"
mismatched-type-name = "error"
missing-argument = "error"
missing-typed-dict-key = "error"
no-matching-overload = "error"
non-callable-init-subclass = "error"
not-iterable = "error"
not-subscriptable = "error"
override-of-final-method = "error"
override-of-final-variable = "error"
parameter-already-assigned = "error"
positional-only-parameter-as-kwarg = "error"
raw-string-type-annotation = "error"
static-assert-error = "error"
subclass-of-final-class = "error"
subclass-of-dataclass-with-order = "error"
super-call-in-named-tuple-method = "error"
too-many-positional-arguments = "error"
type-assertion-failure = "error"
unavailable-implicit-super-arguments = "error"
unbound-type-variable = "error"
unknown-argument = "error"
unresolved-attribute = "error"
unresolved-import = "error"
unresolved-reference = "error"
unsupported-bool-conversion = "error"
unsupported-operator = "error"
zero-stepsize-in-slice = "error"
# Warning-level rules (default) - set to error for strict checking
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-missing-submodule = "error"
pydantic-discarded-extra-argument = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
shadowed-type-variable = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unsupported-dynamic-base = "error"
unused-awaitable = "error"
useless-overload-body = "error"
# Ignore-level rules (default) - set to error for strict checking
blanket-ignore-comment = "error"
division-by-zero = "error"
experimental-syntax = "error"
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.config]
pyproject_root_var = "pyproject"

[tool.codespell]
ignore-words-list = "exat,convertor"
skip = ".git,__pycache__,build,dist"

[tool.bandit]
# Bandit configuration for security scanning
# https://bandit.readthedocs.io/en/latest/config.html

# Target directories to scan
targets = ["archipy"]

# Exclude directories from scanning
exclude_dirs = ["features", "docs", "scripts"]

# Skip specific test IDs
# B101: assert_used - Allow assert statements in tests
# B301: pickle - Allow pickle usage (needed for some serialization)
# B403: import_pickle - Allow pickle imports
skips = ["B101", "B301", "B403"]

[tool.coverage.run]
source = ["archipy", "packages"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.behave]

# Output formatting
show_snippets = false
show_source = false
show_timings = true

# Logging and capture
capture = true
capture_stdout = true
capture_stderr = true
capture_log = true
logging_clear_handlers = true

# Test execution
stop = false
dry_run = false
verbose = false
